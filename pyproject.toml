[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "litopysdb"
version = "0.1.0"
description = "Searchable bibliography from the Book Chamber of Ukraine's Book Chronicle"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "alembic>=1.16,<2",
  "PyMuPDF>=1.26,<2",
  "httpx>=0.28,<1",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "zstandard>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
litopysdb = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
